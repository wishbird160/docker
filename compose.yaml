services:
  db_wiki:
    image: postgres:alpine
    shm_size: 128mb
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD: wikijsrocks
      TZ: Asia/Tokyo
    volumes:
      - db_wiki_data:/var/lib/postgresql
    restart: unless-stopped

  db_redmine:
    image: postgres:alpine
    shm_size: 128mb
    environment:
      POSTGRES_DB: redmine
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: redmine
      TZ: Asia/Tokyo
    volumes:
      - db_redmine_data:/var/lib/postgresql
    restart: unless-stopped

  db_git:
    image: postgres:alpine
    shm_size: 128mb
    environment:
      POSTGRES_DB: gitbucket
      POSTGRES_USER: gitbucket
      POSTGRES_PASSWORD: gitbucket
      TZ: Asia/Tokyo
    volumes:
      - db_git_data:/var/lib/postgresql
    restart: unless-stopped

  mail:
    image: axllent/mailpit
    environment:
      TZ: Asia/Tokyo
    ports:
      - 1025:1025
      - 8025:8025
    restart: unless-stopped

  wiki:
    image: ghcr.io/requarks/wiki:2
    init: true
    environment:
      DB_TYPE: postgres
      DB_HOST: db_wiki
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: wikijsrocks
      DB_NAME: wiki
      TZ: Asia/Tokyo
    volumes:
      - wiki_data:/wiki/data/content
    ports:
      - 80:3000
    depends_on:
      - db_wiki
    restart: unless-stopped

  redmine:
    build: ./redmine
    image: redmine_custom
    environment:
      REDMINE_DB_POSTGRES: db_redmine
      REDMINE_DB_PASSWORD: redmine
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_DATABASE: redmine
      TZ: Asia/Tokyo
    ports:
      - 3000:3000
    volumes:
      - redmine_data:/usr/src/redmine/files
    depends_on:
      - db_redmine
    restart: unless-stopped

  git:
    image: gitbucket/gitbucket
    environment:
      GITBUCKET_DB_URL: jdbc:postgresql://db_git/gitbucket
      GITBUCKET_DB_USER: gitbucket
      GITBUCKET_DB_PASSWORD: gitbucket
      GITBUCKET_MAXFILESIZE: 10485760
      TZ: Asia/Tokyo
    volumes:
      - git_data:/gitbucket
    ports:
      - 8080:8080
      - 29418:29418
    depends_on:
      - db_git
    restart: unless-stopped

  file:
    image: ghcr.io/gtsteffaniak/filebrowser:stable
    environment:
      TZ: Asia/Tokyo
    volumes:
      - ./filebrowser/folder:/folder
      - ./filebrowser/data:/home/filebrowser/data
    ports:
      - 5000:80
    restart: unless-stopped

volumes:
  db_wiki_data:
  db_redmine_data:
  db_git_data:
  wiki_data:
  redmine_data:
  git_data:
